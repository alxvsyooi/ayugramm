[telegram]
; Получить на https://my.telegram.org -> API development tools
api_id = 1234567
api_hash = 0123456789abcdef0123456789abcdef
; имя файла сессии watcher-аккаунта (создастся при первом запуске)
session = watcher

[monitor]
; как часто опрашивать статусы, секунд
poll_interval_sec = 60
; через сколько минут без онлайна считать, что аккаунт "лёг", и ругаться
offline_alert_min = 120
